<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Plenipo — local-first AI workforce. Worker, Supervisor, Manager, VP, President.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D16" />
      <stop offset="1" stop-color="#0C1524" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#2F7BF6" stop-opacity="0.24" />
      <stop offset="1" stop-color="#2F7BF6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17243A" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55" />
  <rect width="1280" height="640" fill="url(#glow)" />
  <rect x="0" y="0" width="1280" height="5" fill="#2F7BF6" />

  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="148" fill="#6E86A3" font-size="17" font-weight="600" letter-spacing="5.5">LOCAL-FIRST AI WORKFORCE</text>
    <text x="80" y="262" fill="#F1F6FD" font-size="108" font-weight="800" letter-spacing="-1">PLENIPO</text>
    <rect x="80" y="286" width="128" height="7" rx="3.5" fill="#2F7BF6" />
    <text x="80" y="356" fill="#B9C9DD" font-size="34" font-weight="600">Hand it an outcome.</text>
    <text x="80" y="400" fill="#B9C9DD" font-size="34" font-weight="600">Your AI organization gets it done.</text>
    <text x="80" y="458" fill="#6E86A3" font-size="19">Worker → Supervisor → Manager → VP → President</text>

    <g font-size="16" font-weight="600">
      <rect x="80" y="498" width="132" height="40" rx="20" fill="#101B2C" stroke="#23344D" />
      <text x="146" y="524" fill="#6AA6FF" text-anchor="middle">Claude Code</text>
      <rect x="222" y="498" width="92" height="40" rx="20" fill="#101B2C" stroke="#23344D" />
      <text x="268" y="524" fill="#6AA6FF" text-anchor="middle">Codex</text>
      <rect x="324" y="498" width="84" height="40" rx="20" fill="#101B2C" stroke="#23344D" />
      <text x="366" y="524" fill="#6AA6FF" text-anchor="middle">Grok</text>
      <rect x="418" y="498" width="98" height="40" rx="20" fill="#101B2C" stroke="#23344D" />
      <text x="467" y="524" fill="#6AA6FF" text-anchor="middle">Ollama</text>
    </g>

    <text x="80" y="592" fill="#4E637D" font-size="16">Windows 11 · Tauri + Rust · Your own sign-ins, or your own keys</text>

    <g stroke="#23344D" stroke-width="1.5" fill="none">
      <path d="M968 142V192" />
      <path d="M968 238V288" />
      <path d="M968 334V384" />
      <path d="M968 430V458" />
      <path d="M878 458H1058" />
      <path d="M878 458V486" />
      <path d="M968 458V486" />
      <path d="M1058 458V486" />
    </g>

    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="880" y="96" width="176" height="46" rx="10" fill="#12243D" stroke="#2F7BF6" stroke-width="1.5" />
      <text x="968" y="126" fill="#EAF2FF">President — you</text>
      <rect x="880" y="192" width="176" height="46" rx="10" fill="#101B2C" stroke="#23344D" />
      <text x="968" y="222" fill="#B9C9DD">VP</text>
      <rect x="880" y="288" width="176" height="46" rx="10" fill="#101B2C" stroke="#23344D" />
      <text x="968" y="318" fill="#B9C9DD">Manager</text>
      <rect x="880" y="384" width="176" height="46" rx="10" fill="#101B2C" stroke="#23344D" />
      <text x="968" y="414" fill="#B9C9DD">Supervisor</text>

      <g font-size="14">
        <rect x="835" y="486" width="86" height="38" rx="9" fill="#0E1828" stroke="#23344D" />
        <text x="878" y="510" fill="#8FA5C0">Worker</text>
        <rect x="925" y="486" width="86" height="38" rx="9" fill="#0E1828" stroke="#23344D" />
        <text x="968" y="510" fill="#8FA5C0">Worker</text>
        <rect x="1015" y="486" width="86" height="38" rx="9" fill="#0E1828" stroke="#23344D" />
        <text x="1058" y="510" fill="#8FA5C0">Worker</text>
      </g>

      <text x="968" y="574" fill="#4E637D" font-size="15" font-weight="400">Permissions · Approvals · Every step recorded</text>
    </g>
