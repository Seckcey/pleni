worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;
  map $uri $cache_policy {
    default "public, max-age=3600";
    / "no-cache";
    /index.html "no-cache";
    /terms/ "no-cache";
    /terms/index.html "no-cache";
    /privacy/ "no-cache";
    /privacy/index.html "no-cache";
    /release.json "no-store";
    /healthz "no-store";
  }
  # Share my profile (ADR-163 §6): never in a search engine.
  map $uri $robots_tag {
    default "";
    ~^/c/ "noindex, nofollow";
  }
  server {
    listen 8080;
    server_name www.getplenipo.com plenipo.8westit.com;
    # Use the original request URI so escaped paths and query strings survive.
    return 308 https://getplenipo.com$request_uri;
  }
  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $cache_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    # Share my profile: the same page for every name (getplenipo.com/c/frank-g). It never
    # checks whether the name exists.
    location ^~ /c/ { try_files $uri /c/index.html; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
    error_page 404 /404.html;
  }
}
