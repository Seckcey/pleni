name: Bug report
description: Something in Pleni does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check that it still happens on the latest `main` first.
        If this is a security problem, close this and read the
        [security policy](https://github.com/Seckcey/pleni/blob/main/SECURITY.md). Never post
        security details in public.

        **Do not paste private things.** No session files, real session text, passwords, tokens,
        or keys. Replace your name, your computer's name, and your folder names with made-up ones,
        such as `/home/ada/project`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
      placeholder: I opened the map and …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Does it also happen in demo mode?
      description: Start Pleni with `node bin/pleni.js --demo` and try the same steps.
      options:
        - "Yes"
        - "No, only with my own sessions"
        - I did not try
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pleni version or commit
      description: The version, or the commit from `git rev-parse --short HEAD`.
      placeholder: 0.1.0 or a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your system
      options:
        - Windows
        - macOS
        - Linux
        - Something else
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      placeholder: Windows 11 24H2, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true
  - type: dropdown
    id: sources
    attributes:
      label: Which sources do you use
      multiple: true
      options:
        - Claude Code in a terminal
        - Claude Code in the Claude desktop app
        - Claude Code in an editor (such as VS Code)
        - Codex
        - A coordination mailbox
        - Demo mode only
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 140, Firefox 143, Safari 18, a phone through tailscale serve
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or messages
      description: >
        Paste what Pleni printed in the terminal, or any message on the page. Remove anything
        private first: folder names and session text can carry your own data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I am on the latest `main`.
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed anything private from what I pasted above.
          required: true
