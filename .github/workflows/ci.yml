name: CI

# Pull requests, and main after a merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request stops that pull request's older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Let every system finish, so one failure does not hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      # Each action is pinned to the exact commit it runs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Pleni has no dependencies, so there is nothing to install.
      - run: node scripts/check.js
      - run: npm test

  relay:
    # The mailbox relay (relay/) is a Windows PowerShell 5.1 program; its test needs Windows, and
    # Node.js for the fake Claude it runs instead of the real one.
    name: Relay test (Windows PowerShell)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Every relay script parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem relay\bin\*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host ('{0}:{1}: {2}' -f $f.Name, $e.Extent.StartLineNumber, $e.Message); $bad++ }
          }
          if ($bad) { exit 1 }
      - name: The relay's own test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File relay\bin\bridge-relay-check.ps1
